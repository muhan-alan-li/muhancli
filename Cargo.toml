[package]
name = "muhancli"
version = "0.1.1"
edition = "2021"
description = "Muhan Li's portfolio in the terminal"
license = "MIT"

[[bin]]
name = "muhan"
path = "src/main.rs"

[lib]
name = "muhancli"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
